
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1020">
  <title>404 — Page Not Found</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --panel: rgba(20, 29, 54, .72);
      --text: #f4f7ff;
      --muted: #a5b0c8;
      --accent: #8b7cff;
      --accent2: #49d6c5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse at 18% 20%, rgba(89, 78, 214, .22), transparent 42%),
        radial-gradient(ellipse at 82% 78%, rgba(42, 196, 180, .13), transparent 38%),
        var(--bg);
    }
    .orb {
      position: fixed;
      width: 320px; height: 320px;
      border: 1px solid rgba(139,124,255,.18);
      border-radius: 50%;
      pointer-events: none;
      box-shadow: 0 0 80px rgba(139,124,255,.08), inset 0 0 70px rgba(139,124,255,.06);
    }
    .orb.one { top: -190px; right: -90px; }
    .orb.two { bottom: -230px; left: -100px; width: 420px; height: 420px; border-color: rgba(73,214,197,.16); }
    main {
      position: relative;
      width: min(100%, 680px);
      padding: clamp(32px, 7vw, 64px);
      text-align: center;
      background: var(--panel);
      border: 1px solid rgba(180, 193, 225, .14);
      border-radius: 28px;
      box-shadow: 0 24px 90px rgba(0,0,0,.35);
      backdrop-filter: blur(18px);
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 8px 13px;
      border: 1px solid rgba(139,124,255,.28);
      border-radius: 999px;
      color: #c6c0ff;
      background: rgba(139,124,255,.09);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .13em;
      text-transform: uppercase;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent2); box-shadow: 0 0 12px var(--accent2); }
    h1 {
      margin: 24px 0 4px;
      font-size: clamp(104px, 23vw, 176px);
      line-height: .9;
      letter-spacing: -.09em;
      font-weight: 850;
      background: linear-gradient(135deg, #fff 18%, #aaa1ff 58%, #65e4d3 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    h2 { margin: 28px 0 12px; font-size: clamp(24px, 4vw, 32px); letter-spacing: -.04em; }
    p { max-width: 430px; margin: 0 auto; color: var(--muted); font-size: 16px; line-height: 1.7; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 30px; }
    a {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 0 20px;
      border-radius: 13px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      transition: transform .2s ease, background .2s ease, border-color .2s ease;
    }
    a:hover { transform: translateY(-2px); }
    .primary { color: #0b1020; background: linear-gradient(110deg, #aaa0ff, #69e2d2); }
    .secondary { color: var(--text); border: 1px solid rgba(180,193,225,.2); background: rgba(255,255,255,.04); }
    footer { margin-top: 34px; color: #6f7b98; font-size: 12px; }
    @media (max-width: 420px) {
      main { border-radius: 22px; }
      .actions { flex-direction: column; }
      .actions a { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="orb one" aria-hidden="true"></div>
  <div class="orb two" aria-hidden="true"></div>
  <main>
    <div class="eyebrow"><span class="dot"></span> Lost in space</div>
    <h1>404</h1>
    <h2>Oops! Page not found</h2>
    <p>The page you're looking for may have moved, been removed, or never existed. Let's get you back on track.</p>
    <div class="actions">
      <a class="primary" href="/" aria-label="Go to homepage">← Back to homepage</a>
      <a class="secondary" href="javascript:history.back()">Go back</a>
    </div>
    <footer>ERROR CODE: 404 · THE PAGE IS OUT OF ORBIT</footer>
  </main>
</body>
</html>
